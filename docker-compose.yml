services:

  postgres:
    image: postgres:16
    container_name: bonus_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bonus_system
      POSTGRES_USER: bonus_user
      POSTGRES_PASSWORD: bonus_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"


  redis:
    image: redis:7-alpine
    container_name: bonus_redis
    restart: unless-stopped

    ports:
      - "6379:6379"


volumes:

  postgres_data: