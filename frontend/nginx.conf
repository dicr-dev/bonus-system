server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend container addresses change on recreate. Resolve through Docker DNS
    # at request time instead of retaining the address from nginx startup.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_api http://backend:8000;

    location /api/ {
        proxy_pass $backend_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
