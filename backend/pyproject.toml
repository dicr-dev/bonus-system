[project]
name="cr-integration-portal-backend"
version="1.1.0"
description="CR Integration Portal backend"
requires-python="==3.12.*"
dependencies=[
 "alembic>=1.19,<2","asyncpg>=0.30,<1","fastapi>=0.141,<1","httpx>=0.28,<1",
 "itsdangerous>=2.2,<3","openpyxl>=3.1,<4","pydantic-settings>=2.14,<3",
 "python-multipart>=0.0.20,<1","redis>=7,<8","sqlalchemy[asyncio]>=2.0.51,<3",
 "uvicorn[standard]>=0.52,<1",
]
[dependency-groups]
dev=["mypy>=2.3,<3","pytest>=9.1,<10","pytest-asyncio>=1.4,<2","ruff>=0.16,<1"]
[build-system]
requires=["uv_build>=0.12.2,<0.13.0"]
build-backend="uv_build"
[tool.uv]
package=true
[tool.uv.build-backend]
module-name="cr_portal"
module-root="src"
[tool.ruff]
line-length=100
target-version="py312"
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
